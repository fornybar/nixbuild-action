name: nixbuild-ci

on:
  workflow_call:
    secrets:
      nixbuild_token:
        required: true
        description: |
          The private auth token used to access nixbuild.net.

          You should not add your private token directly to the workflow file but
          instead define a GitHub Secret for it, to avoid mistakenly sharing your
          token with others.

          Follow the instructions in the README of this action for instructions
          on how to create and configure your auth token.

          The token must have the permissions 'build:read', 'build:write',
          'store:read' and 'store:write'.

          See https://docs.nixbuild.net/access-control/ for more details on auth
          tokens and permissions.

      github_access_token:
        required: false
        description: |
          Defines the access token Nix should use when fetching from GitHub.

    outputs:
      success:
        value: ${{ jobs.ci.outputs.success }}
        description: |
          Outputs the string 'true' if all builds succeeded, otherwise 'false'.
          You need to set `ignore_build_failures` to `true` in order to get the
          'false' result, otherwise your workflow will be terminated before
          you can use this output.

      results:
        value: ${{ jobs.ci.outputs.results }}
        description: |
          Contains a JSON object that maps each build to its result. Look at the
          file `examples/using-the-ci-workflow/expected-result.json` to see an
          example.

    inputs:
      skip_nix_install:
        type: boolean
        required: false
        default: false
        description: |
          If set to true, don't install Nix. This only makes sense if you use
          a runner that already has Nix installed (most likely a self-hosted
          runner).

      nix_version:
        type: string
        default: '2.29.2'
        required: false
        description: |
          The version of Nix that should be used.
          See available versions at
          https://github.com/nixbuild/nix-quick-install-action/releases/tag/v34.

      nix_conf:
        type: string
        default: ''
        required: false
        description: |
          Nix configuration passed to `nix-quick-install-action`.

      nix_args:
        type: string
        default: ''
        required: false
        description: |
          Nix command line arguments passed on to `nix-eval-jobs` and
          `nix build`. The string provided here will be split on every space
          and newline, and the resulting parts will be passed as individual
          arguments. Both commands must accept them: `--option`, `--impure`,
          `--override-input` and `--accept-flake-config` work, `-L` and
          `--refresh` do not.

      oidc:
        type: boolean
        required: false
        default: false
        description: |
          If enabled, nixbuild-action will automatically fetch an OIDC ID
          Token from GitHub and pass it on to nixbuild.net so that OIDC claims
          can be used when authoring Biscuit policies. If this setting is
          enabled, you must make sure your job has the 'id-token: write'
          permission enabled.

      ignore_build_failures:
        type: boolean
        required: false
        default: false
        description: |
          If true, the workflow will not fail even if one or more builds fail.
          This is useful if you want to process the build results in a
          subsequent job. For an example of this, see the workflow in
          `.github/workflows/ci-example.yml`.

      fail_fast:
        type: boolean
        required: false
        default: false
        description: |
          If true, no new builds are started after the first build failure.
          Builds already running are allowed to finish. If false, all builds
          will be attempted no matter how many builds fail. Note,
          `ignore_build_failures` must be false for this option have any
          effect.

      runs_on:
        type: string
        default: 'ubuntu-24.04'
        required: false
        description: |
          The GitHub Actions runner to use.

      filter_builds:
        type: string
        required: false
        default: '.top_attr == "checks"'
        description: |
          A `jq` boolean expression that decides which builds from `flake.nix`
          to build. See the `jq` documentation for info on how to write boolean
          expressions: https://stedolan.github.io/jq/manual/.

          When evaluating the expression, the following fields will be
          available:

          .top_attr : Either "checks" or "packages"
          .system   : The build's system ("x86_64-linux", "aarch64-linux" etc)
          .attr     : The build's attribute name, as defined in your flake
          .name     : The build's derivation name

          Only derivations matching the filter are evaluated, unless the filter
          uses `.name`.

      label_builds:
        type: string
        required: false
        default: '"\(.attr) [\(.system)]"'
        description: |
          A `jq` string expression that defines the label of the build. The
          label is visible in the GitHub Actions UI.
          See the `jq` documentation for info on how to write string
          expressions: https://stedolan.github.io/jq/manual/.

          When evaluating the expression, the following fields will be
          available:

          .top_attr : Either "checks" or "packages"
          .system   : The build's system ("x86_64-linux", "aarch64-linux" etc)
          .attr     : The build's attribute name, as defined in your flake
          .name     : The build's derivation name

      flake:
        type: string
        required: false
        default: '.'
        description: |
          The flake that should be evaluated and built. By default this is `.`,
          which means the flake located in your repository root. But you can
          change this if your `flake.nix` is somewhere else in your repository,
          or if you want to evaluate a flake from some other repository.
          If you want to evaluate a flake in some subdirectory of your
          repository you must prefix that directory with `./`.

      pre_evaluation_script:
        type: string
        required: false
        default: ''
        description: |
          Bash script that should be executed before evaluating the flake.

      pre_build_script:
        type: string
        required: false
        default: ''
        description: |
          Bash script that should be executed once before evaluation and
          builds start.

      max_parallel_builds:
        type: number
        default: 32
        required: false
        description: |
          Maximum number of concurrent `nix build` processes. Builds start as
          soon as their derivation has been evaluated.

      generate_build_summary:
        type: boolean
        default: true
        description: |
          Generate a summary of all builds that has been running during the
          workflow. If you are using ci-workflow.yml multiple times in your
          workflow, it can make sense to disable this summary since otherwise
          you will get the same summary generated multiple times. In such cases,
          you can add an explicit summary job that runs after all other workflow
          jobs and uses nixbuild-action to generate the summary only one time.

      settings:
        type: string
        default: ''
        required: false
        description: |
          Set the `settings` input for nixbuild-action

      tags:
        type: string
        default: ''
        required: false
        description: |
          Set the `tags` input for nixbuild-action

      lfs:
        type: boolean
        default: false
        required: false
        description: |
          Use git-lfs when checking out the repository for the build job.
          See: https://github.com/actions/checkout

      nix_on_tmpfs:
        type: boolean
        default: false
        required: false
        description: |
          On the GitHub runner, put /nix on tmpfs to speed up evaluation. This
          is usually fine to do, since only files used for evaluation will be
          stored in the local Nix store. However, if you have many large
          sources you might run out of disk space during evaluation.

      artifact_prefix:
        type: string
        default: 'ci'
        required: false
        description: |
          Prefix of the `<prefix>-build-results` and `<prefix>-build-logs`
          artifacts. Set distinct prefixes when this workflow is called more
          than once in the same workflow run.

      nix_eval_jobs:
        type: string
        default: ''
        required: false
        description: |
          Installable providing `bin/nix-eval-jobs`, resolved with
          `--inputs-from <flake>`, so `nixpkgs#nix-eval-jobs` uses the
          flake's own `nixpkgs` input. nix-eval-jobs must support `--select`.
          By default the workflow uses nix-eval-jobs 2.35.4 from nixpkgs
          1d060086d60cb76a40cf37109f979d88a5bd6396, fetched by store path from
          cache.nixos.org.

jobs:

  ci:
    name: "Evaluate and build"
    runs-on: ${{inputs.runs_on}}
    outputs:
      success: ${{ steps.build.outputs.success || steps.select.outputs.success }}
      results: ${{ steps.build.outputs.results }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: ${{ inputs.lfs }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/nix
          key: nix-git-cache-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
          restore-keys: |
            nix-git-cache-${{ runner.os }}-
      - if: ${{ ! inputs.skip_nix_install }}
        uses: nixbuild/nix-quick-install-action@v34
        with:
          github_access_token: ${{secrets.github_access_token}}
          nix_on_tmpfs: ${{inputs.nix_on_tmpfs}}
          nix_conf: |
            experimental-features = nix-command flakes
            ${{inputs.nix_conf}}
          nix_version: ${{inputs.nix_version}}
      - uses: nixbuild/nixbuild-action@master
        with:
          nixbuild_token: ${{secrets.nixbuild_token}}
          oidc: ${{inputs.oidc}}
          settings: ${{inputs.settings}}
          tags: ${{inputs.tags}}
          generate_summary_for: ${{ inputs.generate_build_summary && 'workflow' || '' }}
      - name: Configure .netrc for GitHub token
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.github_access_token }}
        run: |
          if [ -n "$GITHUB_ACCESS_TOKEN" ]; then
            printf 'machine github.com\nlogin github-token\npassword %s\n' "$GITHUB_ACCESS_TOKEN" >> "$HOME/.netrc"
            chmod 600 "$HOME/.netrc"
          fi
      - name: Pre-evaluation script
        run: ${{inputs.pre_evaluation_script}}
      - name: Install nix-eval-jobs
        env:
          FLAKE: ${{ inputs.flake }}
          INSTALLABLE: ${{ inputs.nix_eval_jobs }}
        run: |
          set -euo pipefail
          if [ -z "$INSTALLABLE" ]; then
            case "$RUNNER_OS-$RUNNER_ARCH" in
              Linux-X64) INSTALLABLE=/nix/store/sridvbqmfgyh1f2gk3pwf9n4zs98bqjw-nix-eval-jobs-2.35.4 ;;
              Linux-ARM64) INSTALLABLE=/nix/store/agpwd1b8kpg757idbixf1c5vjjnm7nib-nix-eval-jobs-2.35.4 ;;
              macOS-ARM64) INSTALLABLE=/nix/store/9bwlwb6w731vnvn6x3hpa3qnvxcibkz0-nix-eval-jobs-2.35.4 ;;
              *) INSTALLABLE=github:NixOS/nixpkgs/1d060086d60cb76a40cf37109f979d88a5bd6396#nix-eval-jobs ;;
            esac
          fi

          nix_eval_jobs="$(nix build --no-link --print-out-paths --inputs-from "$FLAKE" "$INSTALLABLE")/bin/nix-eval-jobs"
          if ! grep -q -- --select <<< "$("$nix_eval_jobs" --help)"; then
            echo "::error::$INSTALLABLE does not support --select; set nix_eval_jobs to a newer nix-eval-jobs"
            exit 1
          fi
          echo "NIX_EVAL_JOBS=$nix_eval_jobs" >> "$GITHUB_ENV"
      - name: Pre-build script
        run: ${{inputs.pre_build_script}}
      - name: Prepare build directories
        env:
          MAX_PARALLEL: ${{ inputs.max_parallel_builds }}
        run: |
          set -euo pipefail
          if [ "$MAX_PARALLEL" -lt 1 ]; then
            echo "::error::max_parallel_builds must be at least 1"
            exit 1
          fi

          work="$RUNNER_TEMP/nixbuild-ci"
          rm -rf "$work"
          mkdir -p "$work/results" "$work/logs"

      - name: Select builds
        id: select
        env:
          FLAKE: ${{ inputs.flake }}
          NIX_ARGS: ${{ inputs.nix_args }}
          FILTER: ${{ inputs.filter_builds }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/nixbuild-ci"

          nix_args=()
          read -r -d '' -a nix_args <<< "$NIX_ARGS" || true

          workers="$(getconf _NPROCESSORS_ONLN)"
          eval_args=(--workers "$workers")
          if [ -r /proc/meminfo ]; then
            mem_mib="$(awk '/^MemTotal:/ {print int($2 / 1024)}' /proc/meminfo)"
            eval_args+=(--max-memory-size "$(( mem_mib * 3 / 4 / workers ))")
          fi

          prefilter="$FILTER"
          if grep -q name <<< "$FILTER"; then
            prefilter=true
          fi

          if ! "$NIX_EVAL_JOBS" "${eval_args[@]}" "${nix_args[@]}" \
              --flake "$FLAKE" \
              --select '
                flake:
                let
                  recurse = attrs: attrs // { recurseForDerivations = true; };
                  stub = derivation { name = "stub"; system = "stub"; builder = "stub"; };
                  stubs = systems: recurse (builtins.mapAttrs (_: attrs: recurse (builtins.mapAttrs (_: _: stub) attrs)) systems);
                in
                recurse {
                  checks = stubs (flake.outputs.checks or { });
                  packages = stubs (flake.outputs.packages or { });
                }
              ' |
            jq -c '
              {
                top_attr: .attrPath[0],
                system: (.attrPath[1] // ""),
                attr: (.attrPath[2:] | join(".")),
                name: "",
                description: "",
                error
              }
              | select(
                '"$prefilter"'
              )
            ' > "$work/listed.jsonl"; then
            echo "::error::Flake evaluation failed"
            echo "success=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          jq -s 'map(select(.error == null)) | reduce .[] as $j ({}; .[$j.top_attr][$j.system] += [$j.attr])' \
            "$work/listed.jsonl" > "$work/selected.json"

      - name: Evaluate and build
        id: build
        env:
          FLAKE: ${{ inputs.flake }}
          NIX_ARGS: ${{ inputs.nix_args }}
          FILTER: ${{ inputs.filter_builds }}
          LABEL: ${{ inputs.label_builds }}
          IGNORE_FAILURES: ${{ inputs.ignore_build_failures }}
          FAIL_FAST: ${{ inputs.fail_fast }}
          MAX_PARALLEL: ${{ inputs.max_parallel_builds }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          work="$RUNNER_TEMP/nixbuild-ci"

          nix_args=()
          read -r -d '' -a nix_args <<< "$NIX_ARGS" || true

          workers="$(getconf _NPROCESSORS_ONLN)"
          eval_args=(--workers "$workers")
          if [ -r /proc/meminfo ]; then
            mem_mib="$(awk '/^MemTotal:/ {print int($2 / 1024)}' /proc/meminfo)"
            eval_args+=(--max-memory-size "$(( mem_mib * 3 / 4 / workers ))")
          fi

          selection="$(jq -j 'tojson | tojson | gsub("[\u0024]"; "\\\u0024")' "$work/selected.json")"

          evaluate() {
            "$NIX_EVAL_JOBS" "${eval_args[@]}" "${nix_args[@]}" \
              --flake "$FLAKE" \
              --select '
                flake:
                let
                  selected = builtins.fromJSON '"$selection"';
                  recurse = attrs: attrs // { recurseForDerivations = true; };
                  notDerivation = derivation { name = "stub"; system = "stub"; builder = "stub"; } // { ciNotDerivation = true; };
                  orStub = value: if (value.type or null) == "derivation" then value else notDerivation;
                  pick = top: system: attrs:
                    let outputs = builtins.getAttr system (builtins.getAttr top flake.outputs);
                    in recurse (builtins.listToAttrs (map (attr: {
                      name = attr;
                      value = orStub (builtins.getAttr attr outputs);
                    }) attrs));
                in
                recurse (builtins.mapAttrs (top: systems: recurse (builtins.mapAttrs (pick top) systems)) selected)
              ' \
              --apply 'drv: {
                description = (builtins.tryEval (drv.meta.description or "")).value;
                derivation = !(drv.ciNotDerivation or false);
              }' |
            jq -c --unbuffered '
              {
                top_attr: .attrPath[0],
                system: (.attrPath[1] // ""),
                attr: (.attrPath[2:] | join(".")),
                name: (.name // ""),
                description: (.extraValue.description // ""),
                drvPath,
                outputs,
                derivation: (.extraValue.derivation != false),
                error
              }
              | select(
                '"$FILTER"'
              )
            '
          }

          builds() {
            {
              jq -c 'select(.error) | select(
                '"$FILTER"'
              )' "$work/listed.jsonl"
              if [ "$selection" != '"{}"' ]; then
                evaluate
              fi
            } | jq -c --unbuffered '. + {label: (
              '"$LABEL"'
            )}'
          }

          print_log() {
            until mkdir "$work/lock" 2> /dev/null; do sleep 0.1; done
            echo "::group::$1"
            cat "$2"
            echo "::endgroup::"
            rmdir "$work/lock"
          }

          build() {
            local n="$1" job="$2" label log ok=true
            label="$(jq -r .label <<< "$job")"
            log="$work/logs/$n-$(jq -j '"\(.top_attr).\(.system).\(.attr)"' <<< "$job" | tr -c 'A-Za-z0-9._+-' '_').log"

            if jq -e .error <<< "$job" > /dev/null; then
              jq -r .error <<< "$job" > "$log"
              ok=false
            elif ! nix build "$(jq -r .drvPath <<< "$job")^*" \
                --no-link \
                --print-build-logs \
                --eval-store auto \
                --store ssh-ng://nixbuild \
                --builders "" --max-jobs 2 \
                "${nix_args[@]}" 2> "$log"; then
              ok=false
            fi

            jq -c --argjson ok "$ok" '
              {(.top_attr): {(.system): {(.attr):
                ({success: $ok, name, description, label}
                 + if $ok then {drvPath, outputs} else {} end)}}}
            ' <<< "$job" > "$work/results/$n.json"

            if "$ok"; then
              print_log "✅ $label" "$log"
            else
              print_log "❌ $label" "$log"
              echo "::error::Build failed: $label"
              return 1
            fi
          }

          stop_on_failure=false
          if [ "$FAIL_FAST" = true ] && [ "$IGNORE_FAILURES" != true ]; then
            stop_on_failure=true
          fi

          exec {evaluation}< <(builds)
          evaluation_pid=$!

          n=0
          stopped=false
          while IFS= read -r -u "$evaluation" job; do
            if "$stop_on_failure" && [ -e "$work/failed" ]; then
              stopped=true
              break
            fi
            if jq -e '.derivation == false' <<< "$job" > /dev/null; then
              jq -r '"::warning::\(.top_attr).\(.system).\(.attr) is not a derivation"' <<< "$job"
              continue
            fi
            while [ "$(jobs -rp | wc -l)" -ge "$MAX_PARALLEL" ]; do
              wait -n || true
            done
            n=$((n + 1))
            { build "$n" "$job" || touch "$work/failed"; } &
          done
          exec {evaluation}<&-

          evaluation_ok=true
          wait "$evaluation_pid" || evaluation_ok=false
          wait

          hard_failure=false
          if ! "$evaluation_ok" && ! "$stopped"; then
            echo "::error::Flake evaluation failed"
            hard_failure=true
          elif [ "$n" -eq 0 ]; then
            echo "::error::No builds matched filter_builds"
            hard_failure=true
          fi

          success=true
          if "$hard_failure" || [ -e "$work/failed" ]; then
            success=false
          fi

          results="$(cat "$work"/results/*.json /dev/null | jq -cn 'reduce inputs as $r ({}; . * $r)')"
          echo "results=$results" >> "$GITHUB_OUTPUT"
          echo "success=$success" >> "$GITHUB_OUTPUT"

          if "$hard_failure" || { [ "$success" = false ] && [ "$IGNORE_FAILURES" != true ]; }; then
            exit 1
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-build-results
          path: ${{ runner.temp }}/nixbuild-ci/results/*.json
          overwrite: true
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-build-logs
          path: ${{ runner.temp }}/nixbuild-ci/logs/*.log
          overwrite: true
          if-no-files-found: warn
